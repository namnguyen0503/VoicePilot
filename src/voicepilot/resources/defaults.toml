# Cấu hình mặc định của VoicePilot.
# Người dùng ghi đè các giá trị này trong %LOCALAPPDATA%\VoicePilot\config.toml.
# Bảng [websites] và [apps] được gộp theo từng khóa: khóa của người dùng ghi đè khóa mặc định.
# Khóa alias viết thường, giữ nguyên dấu tiếng Việt.

hotkey_listen = "ctrl+alt+v"
hotkey_mode = "ctrl+alt+m"
input_policy = "voice"       # voice | remember | text
last_input_channel = "voice" # voice | text
vad_enabled = true
silence_end_ms = 800
max_command_s = 15
max_dictation_s = 30
no_speech_timeout_s = 5
google_timeout_s = 2.0
stt_mode = "hybrid"          # hybrid | google | offline
gipformer_threads = 2
tts_enabled = true
tts_voice = "vi_VN-vais1000-medium"
history_size = 20
volume_step_percent = 20     # % khi nói "tăng/giảm âm lượng" không kèm số
brightness_step_percent = 20 # % khi nói "tăng/giảm độ sáng" không kèm số
start_with_windows = true     # khởi động cùng Windows (chỉ bản đóng gói)

