# VoicePilot command table, read by voicepilot/intent/parser.py.
#
# Each [[intent]] table has these keys:
#   name     (required) an Intent member from contracts.py, e.g. "PPT_NEXT_SLIDE".
#   patterns (required, except DICTATE_TEXT) Vietnamese phrasings. Write them as you would say them;
#            matching normalizes case, punctuation and spacing on both sides.
#            A placeholder {name} captures the spoken text at that position.
#            Allowed placeholders: query, filename, site, app_name, target, question, amount.
#            {amount} is an optional spoken percentage ("30", "30%", "mười lăm phần trăm"; 1..100).
#            It is not listed in params: a bare phrase is valid and uses the configured default.
#            An unparseable amount ("to lên") is UNKNOWN. Only the volume and brightness intents use it.
#            {question} is only for BROWSER_SEARCH: it searches the whole question after
#            explicit command patterns miss, retaining words such as "bao nhieu".
#            A pattern without placeholders is a bare phrase; if the intent has params, the
#            missing params are reported (for example "tìm" alone gives missing query).
#   context  (optional) PREFERRED window context for ambiguous phrases. Values: "powerpoint",
#            "word", "excel", "browser", "other", "none". It does NOT filter matches. A phrase that only one
#            intent owns is parsed regardless of the window (the executor then reports that
#            the target app is not available). Only a phrase shared by several intents at the
#            same specificity (e.g. "tiếp theo", "quay lại", "mở mới", "đóng") uses context to
#            choose; with no fitting context such a phrase is UNKNOWN with an example.
#            Omit the key for commands that work in any window.
#   params   (optional) parameters the intent needs. A missing one makes the Command
#            non-executable and gives Command.missing.
#   example  (optional) phrase suggested when the command is unknown or incomplete.
#
# Matching rules (implemented in parser.py):
#   1. Pass 1 compares diacritic-preserving normalized text; pass 2 compares diacritic-free
#      text. Pass 2 is used when pass 1 finds nothing, or when it matches a strictly more specific
#      phrase of the same intent.
#   2. Polite fillers ("làm ơn", "giúp tôi", "hãy", "nhé", "ạ", "ơi", ...) are removed from the
#      start and end of the utterance before matching; see parser.py for the list. "đi" and "với"
#      are also removed for rules without free text, so "mở youtube đi" works. Free-text captures
#      ({query}, {filename}) keep them: "tìm đường đi" searches for "đường đi".
#   3. The most specific rule wins: the one with the longest literal text.
#   4. Captured values keep the original text (case, diacritics, inner punctuation, and a closing
#      bracket or quote that balances one inside the value).
#   5. "{target}" is special: "mở {target}" routes to a website (alias, http(s) URL or bare domain)
#      or an app alias, whichever resolves. On Windows, a name that is not an alias falls back to
#      the apps installed on the machine (Start Menu). A name that resolves to none of these is UNKNOWN.
#   6. DICTATE_TEXT is mode-driven: in dictation mode every utterance is text, and no pattern is used.
#
# Speech sources: Google (diacritics, mixed case, punctuation, digits) and Gipformer (lowercase,
# often no punctuation). Both produce the same matches.

# ---------------------------------------------------------------- PowerPoint

[[intent]]
name = "PPT_SAVE"
patterns = ["lưu", "lưu lại", "lưu file", "lưu tệp", "lưu bài trình chiếu", "save"]
context = ["powerpoint"]
example = "Lưu"

[[intent]]
name = "PPT_SAVE_AS"
patterns = [
    "lưu thành {filename}",
    "lưu thành",
    "lưu tên khác là {filename}",
    "lưu tên khác",
    "lưu với tên {filename}",
    "lưu lại với tên {filename}",
    "lưu file thành {filename}",
]
context = ["powerpoint"]
params = ["filename"]
example = "Lưu thành báo cáo tháng 10"

