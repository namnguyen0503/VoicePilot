[[intent]]
name = "PPT_STOP_SHOW"
patterns = [
    "dừng trình chiếu",
    "kết thúc trình chiếu",
    "thoát trình chiếu",
    "tắt trình chiếu",
    "đóng trình chiếu",
    "dừng chiếu",
    "kết thúc chiếu",
    "end show",
]
