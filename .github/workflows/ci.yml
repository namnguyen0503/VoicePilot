name: Windows checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked runtime and test tools
        shell: pwsh
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install pytest pytest-qt ruff==0.16.10
      - name: Ruff
        run: python -m ruff check src tests tools
      - name: Pytest with disposable temporary files
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider --basetemp "$env:RUNNER_TEMP/voicepilot-pytest"
      - name: Feature contracts
        run: python tools/verify_features.py
